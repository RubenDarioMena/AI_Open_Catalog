<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Catalog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header class="glass-header">
        <div class="logo">AI Catalog</div>
        <nav>
            <ul id="category-nav">
                <!-- Categories will be injected here -->
                <li><a href="#" class="active" data-category="all">All Models</a></li>
            </ul>
        </nav>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search models...">
        </div>
    </header>

    <main id="main-content">
        <!-- Content will be injected here -->
        <section id="hero" class="hero-section">
            <h1>AI Model Catalog</h1>
            <p>The most recent AI models I found. Any contributions are appreciated.</p>
        </section>

        <section id="model-grid" class="model-grid">
            <!-- Model cards will be injected here -->
        </section>
    </main>

    <div id="detail-modal" class="modal hidden">
        <div class="modal-content glass-panel">
            <button id="close-modal" class="close-btn">&times;</button>
            <div class="modal-header">
                <h2 id="modal-title">Model Name</h2>
                <span id="modal-category" class="tag">Category</span>
            </div>
            <div class="modal-body">
                <p id="modal-description">Description goes here...</p>
                <div class="modal-meta">
                    <span id="modal-date">Date</span>
                    <a href="#" id="modal-link" target="_blank" class="external-link">View Source</a>
                </div>
                <div class="launch-card-container">
                    <div class="launch-card">
                        <div class="launch-icon">🚀</div>
                        <h3>Ready to Explore?</h3>
                        <p>Visit the official project page to see demos, code, and more.</p>
                        <a href="#" id="modal-launch-btn" target="_blank" class="launch-btn">Launch Project</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="section_config.js"></script>
    <script src="app.js"></script>
</body>

</html>
